services:

  postgres:
    image: postgres:16
    container_name: athletevision-postgres

    environment:
      POSTGRES_DB: athletevision
      POSTGRES_USER: athletevision
      POSTGRES_PASSWORD: athletevision_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athletevision -d athletevision"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: